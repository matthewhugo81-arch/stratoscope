name: Prepare GloSea seasonal wind outlook
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after a successful real-data validation run has been reviewed
        type: boolean
        default: false
  schedule:
    - cron: '17 13 11 * *'
permissions:
  contents: write
concurrency:
  group: prepare-glosea
  cancel-in-progress: false
jobs:
  prepare:
    # Opt in only after a real download has been checked and terms accepted.
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false && vars.GLOSEA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CDS client and decoder
        run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt
      - name: Retrieve and validate wind ensemble
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: python -u scripts/prepare-glosea.py
      - name: Publish small wind dataset
        if: (github.event_name == 'schedule' && vars.GLOSEA_PUBLISH_ENABLED == 'true') || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh auth setup-git --hostname github.com
          python scripts/publish-glosea.py
