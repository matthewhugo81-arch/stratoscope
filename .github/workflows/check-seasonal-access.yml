name: Check seasonal archive access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        kind: [era5, hindcast, jma, bom]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt
      - name: Check official dataset access
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          CHECK_KIND: ${{ matrix.kind }}
        run: python -u scripts/probe-seasonal.py "$CHECK_KIND"
