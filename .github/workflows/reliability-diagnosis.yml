name: Diagnose pipeline reliability
on:
  push:
    branches: [fix/pipeline-stability-20261010]
    paths: [.github/workflows/reliability-diagnosis.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'matthewhugo81-arch/stratoscope'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt
      - name: Inspect public catalogues, origin errors and official mirror
        run: |
          python -u - <<'PY'
          import importlib.util, json, urllib.request, traceback
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('audit', 'scripts/check-pipelines.py')
          audit=importlib.util.module_from_spec(spec);spec.loader.exec_module(audit)
          prep=audit.preparation()
          def published(model):
              try:
                  data=audit.public('forecast-data-'+model.replace('_','-'))
                  audit.validate_catalogue(model,data)
                  print('CATALOGUE',json.dumps({k:data.get(k) for k in ['model','run','preparedAt','complete','count','maxHour']}),flush=True)
              except Exception as e:print('CATALOGUE_ERROR',model,repr(e),flush=True)
          with ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(published,['gefs','ifs_ens','aifs_ens','icon']))
          for model in ['ifs_ens','aifs_ens']:
              for origin in ['https://data.ecmwf.int/forecasts','https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com']:
                  prep.EC_ORIGIN=origin
                  try:print('PROVIDER',model,origin,prep.discover(model).isoformat(),flush=True)
                  except Exception as e:print('PROVIDER_ERROR',model,origin,repr(e),flush=True)
          try:
              with urllib.request.urlopen('https://matthewhugo81-arch.github.io/stratoscope/',timeout=30) as response:
                  body=response.read().decode();print('LIVE_SITE',response.status,len(body),body[:150],flush=True)
          except Exception as e:print('LIVE_SITE_ERROR',repr(e),flush=True)
          print('TEST_FILES',json.dumps([str(p) for p in Path('scripts').glob('*test*')]),flush=True)
          PY
