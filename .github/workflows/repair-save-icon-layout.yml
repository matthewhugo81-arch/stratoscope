name: Repair Save icon layout
on:
  push:
    branches: [fix/save-icon-sizing-20261010]
    paths: [.github/workflows/repair-save-icon-layout.yml]
permissions:
  contents: write
concurrency:
  group: save-icon-layout-repair
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 60
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preserve current main changes and regenerate only the reviewed CSS correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=60 origin main:refs/remotes/origin/main
          python - <<'PY'
          from pathlib import Path
          import subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          main=git('rev-parse','origin/main')
          print('PRESERVED_MAIN='+main,flush=True)
          # Only the reviewed frame-strip update is incorporated here. An
          # unexpected concurrent edit must be reviewed rather than overwritten.
          changes=git('diff','--name-only','f6db327b7d480eb5c563ee6ffc5737aebaee0dab',main).splitlines()
          assert all(p in ['app/globals.css','components/forecast-stamps.tsx'] or p.startswith('docs/') for p in changes),changes
          result=subprocess.run(['git','merge','--no-commit','--no-ff','origin/main'])
          conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
          assert result.returncode==0 or conflicts, 'Merge failed without resolvable generated-file conflicts'
          assert all(p=='app/globals.css' or p.startswith('docs/') for p in conflicts),conflicts
          # Re-apply exactly the browser-tested selector fixes to the newest
          # stylesheet, keeping its new frame-strip Save styling intact.
          css=subprocess.check_output(['git','show',main+':app/globals.css'],text=True)
          edits=[
              ('.nh-diagnostic-chart svg','.nh-diagnostic-chart>svg',3),
              ('.native-seasonal-chart svg','.native-seasonal-chart .seasonal-plot>svg',1),
              ('.seasonal-plot svg','.seasonal-plot>svg',1),
              ('.nh-diagnostic-chart h3 span','.nh-diagnostic-chart h3>span:not(.image-save-wrap)',1),
          ]
          for old,new,count in edits:
              assert css.count(old)==count,(old,css.count(old))
              css=css.replace(old,new)
          css+='''
          /* Export glyphs are controls, never chart-sized SVGs. Also bounds the busy spinner. */
          button.image-save>svg{display:block;width:13px;min-width:13px;max-width:13px;height:13px;min-height:13px;max-height:13px;flex:0 0 13px}
          button.image-save>span{display:inline;margin:0;padding:0;background:none;color:inherit;font:inherit;letter-spacing:normal}
          '''
          Path('app/globals.css').write_text(css)
          subprocess.run(['git','add','app/globals.css'],check=True)
          # Never hand-merge minified assets: rebuild from the merged sources.
          subprocess.run(['git','rm','-rf','--ignore-unmatch','--','docs'],check=True)
          subprocess.run(['git','checkout',main,'--','docs'],check=True)
          assert not git('diff','--name-only','--diff-filter=U')
          assert git('hash-object','components/forecast-stamps.tsx')==git('rev-parse',main+':components/forecast-stamps.tsx')
          PY
      - run: npm ci --no-audit --no-fund
      - name: Recheck types and the complete 84-test regression suite
        run: |
          npm exec -- tsc --noEmit
          node --test tests/*.test.mjs > /tmp/js-regression.log 2>&1 || { cat /tmp/js-regression.log; exit 1; }
          tail -n 12 /tmp/js-regression.log
          npm run build:pages
      - name: Install isolated cross-browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.63.0
          python -m playwright install --with-deps chromium webkit > /tmp/playwright-setup.log 2>&1 || { tail -n 80 /tmp/playwright-setup.log; exit 1; }
      - name: Verify mobile and desktop icon bounds and PNG exports after integration
        run: |
          python -u tests/verify_save_icon_layout.py
          python -u tests/verify_png_exports.py
      - name: Commit only tested integrated site and rebuilt static assets
        run: |
          git add app/globals.css docs
          git diff --cached --check
          git commit -m 'Preserve latest frame-strip export and deploy tested 13px Save icon layout'
          git push origin HEAD:refs/heads/fix/save-icon-sizing-20261010
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
