name: Test pipeline reliability
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-pipelines.py'
      - 'scripts/prepare-ensembles.py'
      - 'scripts/ecmwf_transport.py'
      - 'scripts/pipeline_freshness.py'
      - 'scripts/seasonal_config.py'
      - 'scripts/prepare-seasonal.py'
      - 'tests/test_pipeline_reliability.py'
      - 'tests/test_ecmwf_feed_recovery.py'
      - 'tests/test_seasonal*.py'
      - '.github/workflows/test-pipelines.yml'
      - '.github/workflows/check-pipelines.yml'
      - '.github/workflows/prepare-ensembles.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'tests/test_*.py'
      - '.github/workflows/test-pipelines.yml'
      - '.github/workflows/check-pipelines.yml'
      - '.github/workflows/prepare-ensembles.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt
      - name: Test transport, complete publications, release dates and security without live requests
        run: |
          python -m py_compile scripts/check-pipelines.py scripts/prepare-ensembles.py scripts/ecmwf_transport.py scripts/pipeline_freshness.py scripts/seasonal_config.py scripts/prepare-seasonal.py
          python -m unittest discover -s tests -p test_pipeline_reliability.py -v
          python -m unittest discover -s tests -p test_ecmwf_feed_recovery.py -v
          python -m unittest discover -s tests -p 'test_seasonal*.py' -v
          python -m unittest discover -s tests -p test_source_security.py -v
          python scripts/check-source-security.py
