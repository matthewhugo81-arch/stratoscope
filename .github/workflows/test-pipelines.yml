name: Test pipeline reliability
on:
  push:
    branches: [main, fix/pipeline-stability-20261010]
    paths:
      - 'scripts/check-pipelines.py'
      - 'scripts/prepare-ensembles.py'
      - 'tests/test_pipeline_reliability.py'
      - '.github/workflows/test-pipelines.yml'
      - '.github/workflows/check-pipelines.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check-pipelines.py'
      - 'scripts/prepare-ensembles.py'
      - 'tests/test_pipeline_reliability.py'
      - '.github/workflows/test-pipelines.yml'
      - '.github/workflows/check-pipelines.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt
      - name: Compile and test fault handling without network or dispatches
        run: |
          python -m py_compile scripts/check-pipelines.py scripts/prepare-ensembles.py
          python -m unittest discover -s tests -p test_pipeline_reliability.py -v
      - name: Read-only live repair verification
        if: github.ref == 'refs/heads/fix/pipeline-stability-20261010'
        run: |
          python -u scripts/check-pipelines.py
          python -u - <<'PY'
          import hashlib, importlib.util, json, re
          from urllib.parse import urljoin
          spec=importlib.util.spec_from_file_location('audit','scripts/check-pipelines.py')
          audit=importlib.util.module_from_spec(spec);spec.loader.exec_module(audit)
          for model in ['gefs','ifs_ens','aifs_ens','icon']:
              branch='forecast-data-'+model.replace('_','-')
              m=audit.public(branch);audit.validate_catalogue(model,m)
              for hour in [0,m['maxHour']]:
                  entry=m['files'][f"{m['levels'][0]}/{hour}"]
                  payload=audit.fetch(audit.RAW+branch+'/'+entry['path'])
                  assert len(payload)==entry['bytes'], 'Published frame byte count mismatch'
                  assert hashlib.sha256(payload).hexdigest()==entry['sha256'], 'Published frame hash mismatch'
              print('VERIFIED',model,m['run'],'complete',len(m['files']),'frames; first/last downloads match SHA-256',flush=True)
          site='https://matthewhugo81-arch.github.io/stratoscope/'
          html=audit.fetch(site).decode()
          assets=[urljoin(site,path) for path in re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"',html)]
          assert assets, 'No compiled application assets referenced'
          for asset in assets:
              assert audit.fetch(asset), 'Empty application asset'
          print('VERIFIED live site and',len(assets),'compiled JS/CSS assets',flush=True)
          PY
