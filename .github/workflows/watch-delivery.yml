name: Watch newly released model data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/watch-delivery.py', '.github/workflows/watch-delivery.yml']
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: [Prepare GEFS model maps, Prepare public ensemble maps, Prepare public DWD ICON maps, Prepare GEFS vortex geometry, Prepare native seasonal wind charts]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: bounded-model-release-watch
  cancel-in-progress: false
jobs:
  pickup:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt
      - name: Check release-watcher regressions
        run: python -m unittest discover -s tests -p test_delivery_watch.py -v
      - name: Pick up available runs every five minutes within this bounded execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/watch-delivery.py --minutes 50 --interval 300
