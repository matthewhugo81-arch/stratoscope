name: Watch newly released model data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/watch-delivery.py', '.github/workflows/watch-delivery.yml']
  # One short independent watcher each hour, not a fresh watcher for every
  # successful publication. The watcher checks new releases without starting
  # additional full health audits.
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: bounded-model-release-watch
  cancel-in-progress: false
jobs:
  pickup:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Poll for up to 55 minutes, then allow the next hourly watcher to take over.
    # This avoids five-hour jobs and repeated pending-run cancellations.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt
      - name: Check release-watcher regressions
        run: python -m unittest discover -s tests -p test_delivery_watch.py -v
      - name: Pick up available runs every five minutes within this bounded execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/watch-delivery.py --minutes 55 --interval 300
