name: Inspect October seasonal request status
on:
  push:
    branches: [fix/seasonal-release-20261010]
    paths: [.github/workflows/inspect-october-seasonal.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the two saved October GloSea request states
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          python -u - <<'PY'
          import json,os,urllib.request,urllib.error
          root='https://raw.githubusercontent.com/matthewhugo81-arch/stratoscope/forecast-data-seasonal/'
          for i in [0,1]:
              label=f'egrr-202610-{i}'
              try:
                  with urllib.request.urlopen(root+'requests/'+label+'.json',timeout=30) as r:saved=json.load(r)
              except urllib.error.HTTPError as e:
                  if e.code==404:
                      print(label,'not yet submitted',flush=True);continue
                  raise
              assert saved['dataset']=='seasonal-original-pressure-levels' and saved['request']['originating_centre']=='ukmo'
              req=urllib.request.Request('https://cds.climate.copernicus.eu/api/retrieve/v1/jobs/'+saved['id'],headers={'PRIVATE-TOKEN':os.environ['CDSAPI_KEY']})
              with urllib.request.urlopen(req,timeout=45) as r:data=json.load(r)
              print(label,'HTTP',r.status,'status',data.get('status'),'created',data.get('created'),'updated',data.get('updated'),flush=True)
          PY
