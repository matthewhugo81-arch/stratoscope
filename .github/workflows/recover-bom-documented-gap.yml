name: Recover documented BOM October gap
on:
  push:
    branches: [fix/bom-october-gap-20261010]
    paths: [.github/workflows/recover-bom-documented-gap.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply only the documented BOM forecast-start exception
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('scripts/seasonal_config.py')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='54f7e1e8e8000751a3b606df275541800f88984e'
          source=p.read_text()
          marker='def starts_for(model,nominal,hindcast=False):'
          replacement='''# Official C3S known issue I2, reviewed 2026-10-10. Select the 55 most
          # recent AVAILABLE native members, not five consecutive calendar starts.
          # https://confluence.ecmwf.int/spaces/CKB/pages/87853536/C3S+Seasonal+Forecast+known+issues
          BOM_MISSING_STARTS={'2026-04':{'2026-03-29'},'2026-10':{'2026-09-29'}}
          def forecast_request_label(model,nominal,index,hindcast=False):
           label=f'{model}-{nominal:%Y%m}-{index}'
           # The older-month order changes; retain the old checkpoint for audit and
           # continue reusing the unchanged first-of-month CDS request.
           if model=='ammc' and not hindcast and index==0 and nominal.strftime('%Y-%m') in BOM_MISSING_STARTS:
            label+='-c3s-i2-v1'
           return label
          def starts_for(model,nominal,hindcast=False):'''
          assert source.count(marker)==1
          source=source.replace(marker,replacement)
          old=" count={'egrr':25,'rjtd':11,'ammc':5}.get(model,1)"
          new=" if model=='ammc':\n  missing=BOM_MISSING_STARTS.get(nominal.strftime('%Y-%m'),set())\n  candidates=[nominal-timedelta(days=d) for d in range(11)]\n  starts=[d for d in candidates if d.strftime('%Y-%m-%d') not in missing][:5]\n  if len(starts)!=5:raise ValueError('Insufficient documented available BOM starts')\n  return starts\n"+old
          assert source.count(old)==1
          p.write_text(source.replace(old,new))
          p=Path('scripts/prepare-seasonal.py')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='893c3666d7a9efe411c5ad0726e31e613ed751f1'
          source=p.read_text();old="  label=f'{model}-{nominal:%Y%m}-{i}'"
          assert source.count(old)==1
          p.write_text(source.replace(old,'  label=forecast_request_label(model,nominal,i,hindcast)'))
          PY
      - run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt
      - name: Validate complete native ensembles, checkpoint safety and all seasonal regressions
        run: |
          python -m py_compile scripts/seasonal_config.py scripts/prepare-seasonal.py
          python -m unittest discover -s tests -p 'test_seasonal*.py' -v
          python scripts/check-source-security.py
      - name: Commit tested BOM-specific source correction
        id: publish
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/seasonal_config.py scripts/prepare-seasonal.py
          git commit -m 'Follow documented C3S BOM I2 availability while retaining 55 complete daily members'
          git push origin HEAD:refs/heads/fix/bom-october-gap-20261010
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "TESTED_BOM_COMMIT=$(git rev-parse HEAD)"
  recover:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    concurrency:
      group: seasonal-forecast
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt
      - name: Prepare and publish only the complete October BOM forecast
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh auth setup-git --hostname github.com
          python -u scripts/prepare-seasonal.py --phase forecast --model ammc --month 2026-10
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          import sys
          sys.path.insert(0,'scripts')
          from seasonal_config import current_forecast
          data=json.loads(Path('work/seasonal-publish/forecast/ammc.json').read_text())
          assert data['nominal']=='2026-10-01T00:00:00.000Z'
          assert current_forecast(data,'ammc',datetime(2026,10,1,tzinfo=timezone.utc))
          print('BOM_OCTOBER_VERIFIED',data['memberCount'],'members',len(data['dates']),'daily samples','starts',sorted({m['start'] for m in data['members']}))
          PY
      - name: Recheck publication health after this attempt
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check-pipelines.yml --ref main
