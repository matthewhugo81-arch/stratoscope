name: Reverify model delivery and browser loading
on:
  push:
    branches: [fix/delivery-latency-20261011]
    paths: [.github/workflows/reverify-delivery.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Repeat all guarded source, regression, parallel-equivalence and real-browser checks
        run: |
          python -u - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          workflow=yaml.load(Path('.github/workflows/verify-delivery.yml').read_text(),Loader=yaml.BaseLoader)
          for step in workflow['jobs']['verify']['steps']:
              if 'run' not in step:continue
              print('VERIFICATION_STEP',step.get('name','command'),flush=True)
              command=step['run']
              if step.get('name')=='Load direct IFS from the real official source in a browser':
                  old='browser=p.chromium.launch();page=browser.new_page()'
                  assert command.count(old)==1
                  command=command.replace(old,old+'\n        page.on("console",lambda m:print("BROWSER_CONSOLE",m.type,m.text[:350],flush=True) if m.type=="error" else None)\n        page.on("requestfailed",lambda r:print("BROWSER_REQUEST",r.url,r.failure,flush=True))')
              subprocess.run(['bash','-eu','-o','pipefail','-c',command],check=True)
          PY
