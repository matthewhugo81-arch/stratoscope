name: Verify final forecast preview PNG export
on:
  push:
    branches: [fix/save-forecast-frames-20261010]
    paths: [.github/workflows/verify-stamp-png.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compile and run all existing tests
        run: |
          npm ci --no-audit --no-fund
          npm exec -- tsc --noEmit
          node --test tests/*.test.mjs
          npm run build:pages
      - name: Install isolated headless browser
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install chromium
      - name: Test actual PNG preview downloads and current-frame identity
        run: |
          python -u - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          from playwright.sync_api import sync_playwright
          import subprocess,time,urllib.request
          fixture=Path('preview-export-smoke.html')
          fixture.write_text("""<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="root"></div><script type="module">
          import React from 'react';
          import {createRoot} from 'react-dom/client';
          import {ForecastStamps} from './components/forecast-stamps.tsx';
          import './app/globals.css';
          const run='2026-10-10T00:00:00.000Z',n=360*91,grid={nx:360,ny:91,lat0:90,lon0:0,dx:1,dy:-1};
          const frame={run,hour:0,valid:run,level:10,model:'gfs',source:'test-fixture',grid,
            temperature:Array.from({length:n},(_,i)=>-60+15*Math.sin(i/120)),
            height:Array.from({length:n},(_,i)=>31000+450*Math.sin(i/290)),u:Array(n).fill(-7),v:Array(n).fill(3)};
          createRoot(document.querySelector('#root')).render(React.createElement(ForecastStamps,{
            times:[{hour:0,frame},{hour:6}],hour:0,run,field:'temperature',onSelect:()=>{}
          }));
          </script></body></html>""",encoding='utf8')
          log=open('/tmp/stratoscope-preview-vite.log','w')
          server=subprocess.Popen(['npm','run','dev:pages'],stdout=log,stderr=subprocess.STDOUT)
          try:
            base='http://127.0.0.1:5174/stratoscope/preview-export-smoke.html'
            for _ in range(90):
              try:
                with urllib.request.urlopen(base,timeout=2) as r:
                  if r.status==200:break
              except Exception:time.sleep(.5)
            else:raise AssertionError('Preview browser server failed')
            with sync_playwright() as p:
              browser=p.chromium.launch()
              for width,height in [(1366,768),(390,844)]:
                context=browser.new_context(viewport={'width':width,'height':height},is_mobile=width<500,has_touch=width<500,accept_downloads=True)
                page=context.new_page();page.goto(base,wait_until='domcontentloaded')
                button=page.locator('.stamps-heading .image-save')
                button.wait_for(timeout=30000)
                assert button.is_enabled() and button.is_visible()
                with page.expect_download(timeout=60000) as dl:button.click()
                item=dl.value
                assert item.suggested_filename.endswith('.png')
                content=Path(item.path()).read_bytes()
                assert content.startswith(b'\x89PNG\r\n\x1a\n')
                im=Image.open(BytesIO(content)).convert('RGB')
                assert im.width>=700 and im.height>=700
                colours=im.resize((80,80)).getcolors(6400)
                assert colours and len(colours)>80
                assert not page.locator('.image-save-error:visible').count()
                print('FRAME_PNG_PASS',width,height,im.size,len(content),item.suggested_filename,flush=True)
                context.close()
              browser.close()
          finally:
            server.terminate()
            try:server.wait(timeout=15)
            except Exception:server.kill()
            log.close();fixture.unlink(missing_ok=True)
          PY
      - name: Commit tested Pages bundle
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git diff --cached --quiet || git commit -m 'Build tested high-resolution forecast preview PNG export'
          git push origin HEAD:refs/heads/fix/save-forecast-frames-20261010
          echo "VERIFIED=$(git rev-parse HEAD)"
