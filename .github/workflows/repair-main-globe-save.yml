name: Repair main globe mobile saving
on:
  push:
    branches: [fix/main-globe-mobile-save-20261010]
    paths: [.github/workflows/repair-main-globe-save.yml]
permissions:
  contents: write
concurrency:
  group: main-globe-mobile-export-repair
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Patch only the main globe and its test expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('components/polar-map.tsx')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='aa93a4c025fa08aa47b1f843643a049b6d942df2'
          text=p.read_text()
          text=text.replace("import {SaveImageButton} from './save-image-button';","import {GlobeSaveButton} from './globe-save-button';")
          text=text.replace("import {saveCanvasScene} from '@/lib/image-export';","import {prepareGlobeImage} from '@/lib/globe-image';")
          start=text.index('<SaveImageButton disabled={!frame}')
          end=text.index('/></div><div ref={stage}',start)+2
          text=text[:start]+text[end:]
          helper='''
           function saveCurrentGlobe(){
            if(!frame||!overlay.current)throw Error('Wait for the globe to finish loading.');
            paint.current();
            const b=view.current.basis,lat=Math.asin(Math.max(-1,Math.min(1,b.front[1])))*180/Math.PI,lon=Math.atan2(b.front[0],b.front[2])*180/Math.PI;
            const orientation=`${Math.abs(lat).toFixed(0)}°${lat<0?'S':'N'} · ${Math.abs(lon).toFixed(0)}°${lon<0?'W':'E'} · ${view.current.zoom.toFixed(1)}×`;
            return prepareGlobeImage({frame,basis:b,zoom:view.current.zoom,field,contours,viewport:{...viewport.current},overlay:overlay.current,software:!renderer.current,caption:{
             filename:`stratoscope-${frame.model??'gfs'}-${frame.level}hpa-${field}-${frame.run.slice(0,10)}-${frame.run.slice(11,13)}z-plus${String(frame.hour).padStart(3,'0')}`,
             title:`${(frame.model??'GFS').toUpperCase()} · ${frame.level} hPa ${field==='wind'?'Wind speed':'Temperature'}${frame.ensemble?.view==='spread'?' spread':''}`,
             subtitle:`Run ${frame.run.slice(0,16)} UTC · valid ${frame.valid.slice(0,16)} UTC · forecast +${frame.hour}h`,
             notes:[`Displayed orientation: ${orientation}. ${contours?'Height contours shown.':'Height contours hidden.'} ${graticule?'Graticule shown.':'Graticule hidden.'} ${windArrows&&field==='wind'?'Wind arrows shown.':''}`,`Official ${frame.model??'GFS'} forecast; ${field==='temperature'?'temperature in °C':'wind speed in m/s'}, height contours in dam.`]
            }});
           }
          '''
          needle=' const release=(id:number)=>'
          assert text.count(needle)==1
          text=text.replace(needle,helper+needle)
          text=text.replace('className="globe-caption"','className="globe-caption globe-save-row"')
          needle='{position}</output></div>{software'
          assert text.count(needle)==1
          text=text.replace(needle,'{position}</output><GlobeSaveButton disabled={!frame} onPrepare={saveCurrentGlobe}/></div>{software')
          p.write_text(text)
          p=Path('app/globals.css')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='cf93cfd4d699b34e2bd488694cdbe50b548c52e3'
          css=p.read_text()
          css+='''
          /* Main globe only: keep saving and messages off the meteorological image. */
          .globe-wrap>.globe-save-row{position:static;inset:auto;pointer-events:auto;display:flex;flex:none;flex-direction:row;align-items:center;gap:6px 12px;margin:5px 0 3px;min-height:28px}
          .globe-save-row>span,.globe-save-row>output{background:none;padding:0}
          .globe-save-control{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-left:auto;max-width:100%}
          .globe-save-control>button.image-save{background:transparent;border-color:#3b596266;color:#95b6c2}
          .globe-save-error{color:#efc281;font:11px/1.5 Arial,sans-serif;white-space:normal}
          .globe-save-dialog{width:680px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 32px);margin:auto;padding:14px;border:1px solid #41616b;border-radius:9px;background:#0d202a;color:#d9edf3;overflow:auto;overscroll-behavior:contain;box-shadow:0 10px 45px #0009}
          .globe-save-dialog::backdrop{background:#020a12bb}
          .globe-save-dialog>header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
          .globe-save-dialog h2{font:500 17px/1.4 Arial,sans-serif;margin:0}
          .globe-save-dialog>header>button{display:flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;border:0;background:transparent;color:#b6d3dc;cursor:pointer}
          .globe-save-dialog .globe-save-preview{display:block;width:100%;height:auto;max-height:55dvh;object-fit:contain;background:#0d202a;-webkit-touch-callout:default}
          .globe-save-dialog>p{font:12px/1.5 Arial,sans-serif;color:#a9c2ce;margin:10px 0}
          .globe-save-actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
          .globe-save-actions>button,.globe-save-actions>a{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 12px;background:#19343e;border:1px solid #436771;border-radius:5px;color:#c1e8df;font:13px/1.3 Arial,sans-serif;cursor:pointer;text-decoration:none}
          @media(max-width:750px),(pointer:coarse){.globe-save-row>span:first-child{display:none}.globe-save-dialog{padding:12px}.globe-save-actions>button,.globe-save-actions>a{min-height:44px}}
          '''
          p.write_text(css)
          p=Path('tests/verify_png_exports.py');text=p.read_text()
          text=text.replace('#sample-globe .globe-tools .image-save','#sample-globe .globe-save-row .image-save')
          old='            download(page,"#sample-globe .image-save",f"{id}-globe.png")'
          new='''            if mobile:
                          page.locator("#sample-globe .globe-save-row .image-save").click()
                          page.locator(".globe-save-dialog").wait_for(state="visible")
                          download(page,".globe-save-actions a[download]",f"{id}-globe.png")
                          page.get_by_role("button",name="Close image preview").click()
                      else:
                          download(page,"#sample-globe .globe-save-row .image-save",f"{id}-globe.png")'''
          # Strip the extra indentation used for YAML readability.
          new=new.splitlines()[0]+'\n'+'\n'.join(line[10:] for line in new.splitlines()[1:])
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          PY
      - run: npm ci --no-audit --no-fund
      - name: Compile and run regression tests
        run: |
          npm exec -- tsc --noEmit
          node --test tests/*.test.mjs
          python -m py_compile tests/verify_png_exports.py tests/verify_globe_mobile_save.py
          npm run build:pages
      - name: Install isolated browser verification tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.63.0 pillow
          python -m playwright install --with-deps chromium webkit > /tmp/browser-setup.log 2>&1 || { tail -n 70 /tmp/browser-setup.log; exit 1; }
      - name: Test mobile image delivery and live globe integrity in both browser engines
        run: python -u tests/verify_globe_mobile_save.py
      - name: Keep the other chart exports working
        run: |
          python -u tests/verify_save_icon_layout.py
          python -u tests/verify_png_exports.py
      - name: Commit only tested main-globe repair and rebuilt static website
        run: |
          git diff --check
          git diff --exit-code -- lib/image-export.ts lib/globe.ts components/save-image-button.ts components/vortex-view.tsx components/heat-flux-chart.tsx components/seasonal-chart.tsx components/northern-diagnostics.tsx components/zonal-wind-card.tsx components/member-panels.tsx components/forecast-stamps.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/polar-map.tsx app/globals.css tests/verify_png_exports.py docs
          git commit -m 'Keep mobile globe uncluttered; preview PNG with isolated snapshot and native sharing'
          git push origin HEAD:refs/heads/fix/main-globe-mobile-save-20261010
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
