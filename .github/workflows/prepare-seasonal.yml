name: Prepare native seasonal wind charts
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [forecast, climate, era5]
        default: forecast
      model:
        type: choice
        options: [all, egrr, ecmf, lfpw, edzw, cmcc, rjtd, ammc]
        default: all
  schedule:
    # Includes 12:37 UTC on release day: ECMWF 6th, other systems 10th.
    # Subsequent checks only start downloads for an unprepared issue.
    - cron: '37 */3 * * *'
permissions:
  contents: write
concurrency:
  group: ${{ inputs.phase == 'era5' && 'era5-daily-reference' || 'seasonal-forecast' }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check release boundaries and skip guards
        run: python -m unittest discover -s tests -p test_seasonal_release.py -v
      - name: Plan only missing released issues
        id: plan
        env:
          REQUESTED_MODEL: ${{ inputs.model || 'all' }}
          REQUESTED_PHASE: ${{ inputs.phase || 'update' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python -u scripts/plan-seasonal-update.py --manual --model "$REQUESTED_MODEL" --phase "$REQUESTED_PHASE"
          else
            python -u scripts/plan-seasonal-update.py --model "$REQUESTED_MODEL" --phase "$REQUESTED_PHASE"
          fi
  prepare:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt
      - name: Prepare and publish validated data
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          SEASONAL_MODEL: ${{ matrix.model }}
          SEASONAL_PHASE: ${{ inputs.phase || 'update' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          gh auth setup-git --hostname github.com
          if [ "$SEASONAL_MODEL" = era5 ]; then
            python -u scripts/prepare-seasonal.py --phase era5
          else
            python -u scripts/prepare-seasonal.py --phase "$SEASONAL_PHASE" --model "$SEASONAL_MODEL"
          fi
