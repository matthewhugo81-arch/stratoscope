name: Prepare native seasonal wind charts
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [forecast, climate, era5]
        default: forecast
      model:
        type: choice
        options: [all, egrr, ecmf, lfpw, edzw, cmcc, rjtd, ammc]
        default: all
  schedule:
    - cron: '37 13 7,11 * *'
permissions:
  contents: write
concurrency:
  group: ${{ inputs.phase == 'era5' && 'era5-daily-reference' || format('seasonal-{0}', inputs.phase || 'update') }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: ${{ fromJSON(inputs.phase == 'era5' && '["era5"]' || inputs.model != '' && inputs.model != 'all' && format('["{0}"]', inputs.model) || github.event_name == 'schedule' && '["egrr","ecmf","lfpw","edzw","cmcc","rjtd","ammc"]' || '["egrr","ecmf","lfpw","edzw","cmcc","rjtd","ammc"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt
      - name: Prepare and publish validated data
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          SEASONAL_MODEL: ${{ matrix.model }}
          SEASONAL_PHASE: ${{ inputs.phase || 'update' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          gh auth setup-git --hostname github.com
          if [ "$SEASONAL_MODEL" = era5 ]; then
            python -u scripts/prepare-seasonal.py --phase era5
          else
            python -u scripts/prepare-seasonal.py --phase "$SEASONAL_PHASE" --model "$SEASONAL_MODEL"
          fi
