name: Retire superseded Stratoscope watcher
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cutover-retire-old-watcher.yml']
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the superseded five-hour watcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old_run=38562578397
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$old_run" --jq .status)
          if [ "$status" != completed ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$old_run/cancel"
            echo "Retired superseded watcher $old_run."
          else
            echo "Superseded watcher $old_run already completed."
          fi
