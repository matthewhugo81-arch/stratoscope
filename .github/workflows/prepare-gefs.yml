name: Prepare GEFS model maps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-gefs.yml']
  schedule:
    - cron: '3 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: prepare-gefs-model-maps
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt
      - name: Prepare all members and times using two independent decoders
        # Two processes x three transfers: the same six-transfer ceiling as before.
        run: python -u scripts/prepare-ensembles.py --model gefs --output work/prepared --workers 3 --hour-workers 2 --skip-published
      - name: Publish complete GEFS run
        if: hashFiles('work/prepared/latest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh auth setup-git --hostname github.com
          python scripts/publish-ensemble-data.py --model gefs --output work/prepared
      - name: Explicitly update vortex, heat flux and diagnostics after publication
        if: success() && github.ref == 'refs/heads/main' && hashFiles('work/prepared/latest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run prepare-diagnostics.yml --ref main
          gh workflow run prepare-vortex.yml --ref main
      - name: Recheck publication health after this attempt
        if: always() && !cancelled() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check-pipelines.yml --ref main
