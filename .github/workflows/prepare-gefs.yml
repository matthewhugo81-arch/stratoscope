name: Prepare GEFS model maps
on:
  workflow_dispatch:
  schedule:
    - cron: '3 * * * *'
permissions:
  contents: write
concurrency:
  group: prepare-gefs-model-maps
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt
      - run: python -u scripts/prepare-ensembles.py --model gefs --output work/prepared --workers 6 --skip-published
      - name: Publish complete GEFS run
        if: hashFiles('work/prepared/latest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh auth setup-git --hostname github.com
          python scripts/publish-ensemble-data.py --model gefs --output work/prepared
