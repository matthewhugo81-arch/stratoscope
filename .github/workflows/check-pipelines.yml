name: Check forecast pipeline freshness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check-pipelines.py'
      - 'scripts/prepare-ensembles.py'
      - 'scripts/ecmwf_transport.py'
      - 'scripts/pipeline_freshness.py'
      - 'scripts/seasonal_config.py'
      - 'tests/test_pipeline_reliability.py'
      - 'tests/test_ecmwf_feed_recovery.py'
      - '.github/workflows/check-pipelines.yml'
  schedule:
    - cron: '11 */3 * * *'
  workflow_run:
    workflows: [Prepare public ensemble maps, Prepare GEFS model maps, Prepare public DWD ICON maps, Prepare GEFS vortex geometry, Prepare ERA5 daily wind climatology, Prepare native seasonal wind charts, Prepare northern diagnostic charts]
    branches: [main]
    types: [completed]
permissions:
  contents: write
  actions: write
concurrency:
  group: forecast-pipeline-health
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt
      - name: Check reliability regressions before recovery
        run: |
          python -m unittest discover -s tests -p test_pipeline_reliability.py -v
          python -m unittest discover -s tests -p test_ecmwf_feed_recovery.py -v
      - name: Audit public feeds and recover idle preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          python -u scripts/check-pipelines.py --recover --publish
