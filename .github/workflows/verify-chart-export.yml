name: Verify chart image saves
on:
  push:
    branches: [feat/subtle-chart-save-20261010]
    paths: [.github/workflows/verify-chart-export.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Integrate scoped save controls
        run: |
          python scripts/apply-export-native.py
          python scripts/apply-export-diagnostics.py
          python scripts/apply-export-maps.py
          python scripts/apply-export-style.py
          python scripts/polish-chart-exports.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_chart_exports.py')
          s=p.read_text().replace("p.evaluate('window.testIssue').slice(0,10) if False else p.evaluate('window.testIssue')[:10]", "p.evaluate('window.testIssue')[:10]")
          # Playwright invokes a returned function. Use an explicit function body
          # so assigning toBlob cannot accidentally call it with no callback.
          s=s.replace("p.evaluate('window.originalToBlob=HTMLCanvasElement.prototype.toBlob;HTMLCanvasElement.prototype.toBlob=function(callback){callback(null)}')", "p.evaluate('()=>{window.originalToBlob=HTMLCanvasElement.prototype.toBlob;HTMLCanvasElement.prototype.toBlob=function(callback){callback(null)}}')")
          s=s.replace("p.evaluate('HTMLCanvasElement.prototype.toBlob=window.originalToBlob')", "p.evaluate('()=>{HTMLCanvasElement.prototype.toBlob=window.originalToBlob}')")
          p.write_text(s)
          PY
          python -m py_compile tests/export_browser_support.py tests/browser_chart_exports.py
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and all native regression tests
        run: |
          npm exec -- tsc --noEmit
          node --test tests/*.test.mjs
      - name: Build the actual GitHub Pages application
        run: npm run build:pages
      - name: Install isolated browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright pillow > /tmp/export-test-install.log 2>&1 || { tail -80 /tmp/export-test-install.log; exit 1; }
          python -m playwright install --with-deps chromium webkit >> /tmp/export-test-install.log 2>&1 || { tail -80 /tmp/export-test-install.log; exit 1; }
      - name: Verify PNG pixels, provenance, mobile, fullscreen and recovery
        run: python -u tests/browser_chart_exports.py
      - name: Commit only tested source, regression coverage and rebuilt assets
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components app/globals.css lib/chart-export*.ts docs tests/browser_chart_exports.py tests/export_browser_support.py tests/chart-export.test.mjs
          git rm .github/workflows/verify-chart-export.yml scripts/apply-export-native.py scripts/apply-export-diagnostics.py scripts/apply-export-maps.py scripts/apply-export-style.py scripts/polish-chart-exports.py
          git commit -m 'Add subtle Save PNG controls across Stratoscope charts and current 3D view'
          git push origin HEAD:refs/heads/feat/subtle-chart-save-20261010
          echo "TESTED_EXPORT_COMMIT=$(git rev-parse HEAD)"
