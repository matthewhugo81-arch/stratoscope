name: Verify and build Save PNG imagery
on:
  push:
    branches: [feature/subtle-save-imagery-20261010]
    paths: [.github/workflows/verify-png-save.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check and all existing JavaScript tests
        run: |
          npm exec -- tsc --noEmit
          node --test tests/*.test.mjs
      - name: Build tracked GitHub Pages assets
        run: npm run build:pages
      - name: Install browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test real Save PNG actions on desktop and mobile
        run: python -u tests/verify_png_exports.py
      - name: Publish tested static assets onto feature branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Build tested Save PNG controls for GitHub Pages'
            git push origin HEAD:refs/heads/feature/subtle-save-imagery-20261010
          fi
          echo "TESTED_DEPLOYMENT_COMMIT=$(git rev-parse HEAD)"

# Re-run after making the PNG screenshot selector unambiguous.
