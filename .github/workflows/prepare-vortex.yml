name: Prepare GEFS vortex geometry
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Prepare GEFS model maps]
    types: [completed]
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: write
concurrency:
  group: prepare-gefs-vortex
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt
      - name: Prepare and checkpoint complete mean-field vortex geometry
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh auth setup-git --hostname github.com
          python -u scripts/prepare-vortex.py --output work/vortex --publish
