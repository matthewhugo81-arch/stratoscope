name: Test chart controls
on:
  push:
    branches: [main]
    paths:
      - 'app/globals.css'
      - 'components/*.tsx'
      - 'lib/image-export.ts'
      - 'tests/save-icon-css.test.mjs'
      - 'tests/verify_save_icon_layout.py'
      - '.github/workflows/test-chart-controls.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/globals.css'
      - 'components/*.tsx'
      - 'lib/image-export.ts'
      - 'tests/save-icon-css.test.mjs'
      - 'tests/verify_save_icon_layout.py'
      - '.github/workflows/test-chart-controls.yml'
permissions:
  contents: read
concurrency:
  group: chart-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Check types and chart-control CSS isolation
        run: |
          npm exec -- tsc --noEmit
          node --test tests/*.test.mjs
      - name: Prepare browser regression tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.63.0
          python -m playwright install --with-deps chromium webkit > /tmp/playwright-setup.log 2>&1 || { tail -n 80 /tmp/playwright-setup.log; exit 1; }
      - name: Check phone and desktop controls and local PNG downloads
        # Synthetic forecast responses only. No CDS, forecast preparation,
        # data publication, paid service, artifact or Actions cache is used.
        run: python -u tests/verify_save_icon_layout.py
