name: Verify ECMWF feed recovery
on:
  push:
    branches: [fix/ecmwf-feed-recovery-20261010]
    paths: [.github/workflows/verify-ecmwf-feed-repair.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply only reviewed transport, monitoring and workflow edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          def update(path, edits, expected=None):
              p=Path(path)
              if expected:assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==expected,(path,'changed unexpectedly')
              text=p.read_text()
              for old,new in edits:
                  assert text.count(old)==1,(path,old[:100],text.count(old))
                  text=text.replace(old,new)
              p.write_text(text)
          update('scripts/prepare-ensembles.py',[
              ("EC_ORIGIN = 'https://data.ecmwf.int/forecasts'", "EC_ORIGIN = 'https://data.ecmwf.int/forecasts'\ntransport_spec=importlib.util.spec_from_file_location('ecmwf_transport',Path(__file__).with_name('ecmwf_transport.py'))\ntransport=importlib.util.module_from_spec(transport_spec);transport_spec.loader.exec_module(transport)\nEC_DOWNLOAD_SOURCES=transport.ORIGINS"),
              ('def ec_base(model, run, hour, control=False):','def ec_base(model, run, hour, control=False, origin=None):'),
              ("    return f'{EC_ORIGIN}/{day}/{cycle}z/{system}/0p25/{stream}/{day}{cycle}0000-{hour}h-{stream}-{kind}'", "    root=transport.validate_origin(origin or EC_DOWNLOAD_SOURCES[0])\n    return f'{root}/{day}/{cycle}z/{system}/0p25/{stream}/{day}{cycle}0000-{hour}h-{stream}-{kind}'"),
              ('def ec_entries(model, run, hour, levels, probe=False):','def ec_entries(model, run, hour, levels, probe=False, origin=None):'),
              ('        base = ec_base(model, run, hour, control)','        base = ec_base(model, run, hour, control, origin=origin)'),
              ('def calculate(model, run, hour, levels, workers, panel_writer=None, heat_writer=None):','def calculate(model, run, hour, levels, workers, panel_writer=None, heat_writer=None, origin=None):'),
              ('else ec_entries(model, run, hour, levels)','else ec_entries(model, run, hour, levels, origin=origin)'),
              ("                entries = ec_entries(model,run,cfg['maxHour'],cfg['levels'],probe=True)","                entries = transport.complete_inventory(ec_entries,model,run,cfg['maxHour'],cfg['levels'],cfg['count'],KEYS,origins=EC_DOWNLOAD_SOURCES)"),
              ('    result = calculate(model, run, hour, levels, workers, panel_writer, heat_writer)','    result = transport.calculate_hour(calculate, model, run, hour, levels, workers, panel_writer, heat_writer, origins=EC_DOWNLOAD_SOURCES)'),
          ],'b54c949b01284ef65fe760dcb314633c0e249fa2')
          update('tests/test_pipeline_reliability.py',[
              ('class DiscoveryTests(unittest.TestCase):','class DiscoveryTests(unittest.TestCase):\n    def setUp(self):\n        # Existing single-source cycle tests remain; separate tests exercise all replicas.\n        source_patch=patch.object(prep, "EC_DOWNLOAD_SOURCES", (prep.EC_DOWNLOAD_SOURCES[0],))\n        source_patch.start();self.addCleanup(source_patch.stop)\n')
          ])
          update('scripts/check-pipelines.py',[
              ('    now=datetime.now(timezone.utc);prep=preparation()',
               "    now=datetime.now(timezone.utc);prep=preparation()\n    spec=importlib.util.spec_from_file_location('pipeline_freshness',Path(__file__).with_name('pipeline_freshness.py'))\n    health=importlib.util.module_from_spec(spec);spec.loader.exec_module(health)\n    try:previous=public('forecast-status')\n    except Exception:previous=None"),
              ('    reference=era_reference(args.recover,now) if os.environ.get(\'GH_TOKEN\') else None',
               "    health.record_health(results,previous,now,github if os.environ.get('GH_TOKEN') else None,WORKFLOWS)\n    seasonal=health.seasonal_health(public,now)\n    reference=era_reference(args.recover,now) if os.environ.get('GH_TOKEN') else None"),
              ('    data=dict(version=1,checkedAt=stamp(datetime.now(timezone.utc)),models=results,era5=reference)',
               "    data=dict(version=1,checkedAt=stamp(datetime.now(timezone.utc)),models=results,era5=reference,seasonal=seasonal,scheduledIntervalHours=3)\n    last=health.parsed(previous.get('checkedAt')) if isinstance(previous,dict) else None\n    if last:data['previousCheckGapMinutes']=round(max(0,(now-last).total_seconds()/60),1)"),
              ("    if any(d['status']=='error' for d in results) or reference and reference['status']=='error':raise SystemExit(1)",
               "    if any(d['status']=='error' for d in results+seasonal) or reference and reference['status']=='error':raise SystemExit(1)")
          ],'7519fb17f804aae6f99a3a662b27cbb04e4eb2ae')
          update('.github/workflows/prepare-ensembles.yml',[
              ('  schedule:',"  push:\n    branches: [main]\n    paths: ['scripts/prepare-ensembles.py', 'scripts/ecmwf_transport.py', '.github/workflows/prepare-ensembles.yml']\n  schedule:"),
              ('  contents: write','  contents: write\n  actions: write'),
              ('# Two decoder processes, at most six HTTP transfers across both.','# Two decoder processes, at most four HTTP transfers across both.'),
              ('--workers 3 --hour-workers 2','--workers 2 --hour-workers 2'),
              ('          python scripts/publish-ensemble-data.py --model "$MODEL" --output work/prepared',
               '''          python scripts/publish-ensemble-data.py --model "$MODEL" --output work/prepared
                - name: Refresh diagnostics after this model is published
                  if: success() && github.ref == 'refs/heads/main' && hashFiles('work/prepared/latest.json') != ''
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: gh workflow run prepare-diagnostics.yml --ref main
                - name: Recheck feed health after this attempt
                  if: always() && !cancelled() && github.ref == 'refs/heads/main'
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: gh workflow run check-pipelines.yml --ref main'''.replace('\n          ', '\n'))
          ])
          p=Path('.github/workflows/check-pipelines.yml');text=p.read_text()
          text=text.replace("      - 'scripts/prepare-ensembles.py'", "      - 'scripts/prepare-ensembles.py'\n      - 'scripts/ecmwf_transport.py'\n      - 'scripts/pipeline_freshness.py'\n      - 'tests/test_ecmwf_feed_recovery.py'")
          text=text.replace('Prepare ERA5 daily wind climatology]', 'Prepare ERA5 daily wind climatology, Prepare native seasonal wind charts, Prepare northern diagnostic charts]')
          old='        run: python -m unittest discover -s tests -p test_pipeline_reliability.py -v'
          assert text.count(old)==1
          text=text.replace(old,'        run: |\n          python -m unittest discover -s tests -p test_pipeline_reliability.py -v\n          python -m unittest discover -s tests -p test_ecmwf_feed_recovery.py -v')
          p.write_text(text)
          PY
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt pyyaml
      - name: Compile and test old and new safety checks
        run: |
          python -m py_compile scripts/prepare-ensembles.py scripts/check-pipelines.py scripts/ecmwf_transport.py scripts/pipeline_freshness.py
          python -m unittest discover -s tests -p test_pipeline_reliability.py -v
          python -m unittest discover -s tests -p test_ecmwf_feed_recovery.py -v
          python -m unittest discover -s tests -p test_source_security.py -v
          python scripts/check-source-security.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.load(Path('.github/workflows/prepare-ensembles.yml').read_text(),Loader=yaml.BaseLoader)
          steps=d['jobs']['prepare']['steps']
          assert len(steps)==7 and steps[-1]['run']=='gh workflow run check-pipelines.yml --ref main',steps
          d=yaml.load(Path('.github/workflows/check-pipelines.yml').read_text(),Loader=yaml.BaseLoader)
          assert d['on']['schedule']==[{'cron':'11 */3 * * *'}]
          print('Validated workflow structure; three-hour schedule retained')
          PY
      - name: Decode and verify all 51 members at the terminal forecast hour on the new primary replica
        run: |
          python -u scripts/prepare-ensembles.py --model ifs_ens --run 2026-10-10T12:00:00Z --hours 360 --workers 2 --hour-workers 1 --output work/smoke-ifs
          python -u scripts/prepare-ensembles.py --model aifs_ens --run 2026-10-10T12:00:00Z --hours 360 --workers 2 --hour-workers 1 --output work/smoke-aifs
          python - <<'PY'
          import gzip,hashlib,json,struct
          from pathlib import Path
          for model in ['ifs','aifs']:
              root=Path('work/smoke-'+model);m=json.loads((root/'latest.json').read_text())
              assert m['count']==51 and len(m['files'])==3 and m['complete'] is False
              for entry in [*m['files'].values(),*m['panels'].values()]:
                  b=(root/entry['path']).read_bytes();assert len(b)==entry['bytes'] and hashlib.sha256(b).hexdigest()==entry['sha256']
                  raw=gzip.decompress(b);n=struct.unpack('<I',raw[8:12])[0];header=json.loads(raw[12:12+n])
                  assert header['run']=='2026-10-10T12:00:00.000Z' and header['count']==51 and header['hour']==360
              print('ALL_MEMBER_MIRROR_PASS',model,'51 members','10/50/100 hPa','forecast +360h')
          PY
      - name: Commit only tested source and workflow changes
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prepare-ensembles.py scripts/check-pipelines.py tests/test_pipeline_reliability.py .github/workflows/check-pipelines.yml .github/workflows/prepare-ensembles.yml
          git commit -m 'Fix ECMWF replica downloads and make failed or prolonged recoveries fail the health check'
          git push origin HEAD:refs/heads/fix/ecmwf-feed-recovery-20261010
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
