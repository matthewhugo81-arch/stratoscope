name: Verify Stratoscope PNG save controls
on:
  push:
    branches: [feature/chart-png-exports-20261010]
    paths:
      - '.github/workflows/verify-image-exports.yml'
      - 'lib/image-export.ts'
      - 'components/**'
      - 'tests/test_image_export_browser.py'
      - 'app/globals.css'
permissions:
  contents: write
concurrency:
  group: verify-chart-exports
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict typecheck
        run: npm exec -- tsc --noEmit
      - name: Full existing frontend regression suite
        run: node --test tests/*.test.mjs
      - name: Build actual GitHub Pages assets
        run: npm run build:pages
      - name: Install isolated browser screenshot test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
      - name: Download actual PNG images across desktop, mobile and fullscreen views
        run: python -u tests/test_image_export_browser.py
      - name: Commit the tested static Pages bundle
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then
            echo 'Build already matches committed Pages assets.'
          else
            git commit -m 'Publish validated chart PNG export controls to GitHub Pages'
            git push origin HEAD:refs/heads/feature/chart-png-exports-20261010
          fi
          echo "TESTED_SOURCE_SHA=$(git rev-parse HEAD)"
