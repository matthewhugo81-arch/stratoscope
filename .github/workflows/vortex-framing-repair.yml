name: Verify fullscreen vortex framing repair
on:
  push:
    branches: [fix/vortex-upward-75px-20261010]
    paths: [.github/workflows/vortex-framing-repair.yml]
permissions:
  contents: write
concurrency:
  group: vortex-framing-repair
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the agreed canvas-origin adjustment
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('components/vortex-view.tsx')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='37ee35e7ef22696e12c9a535cf75235116d59984', 'Viewer changed; review before patching'
          source=p.read_text()
          edits=[
            ("import {projectVortexPoint} from '@/lib/vortex-projection';", "import {projectVortexPoint,vortexScreenOrigin} from '@/lib/vortex-projection';"),
            ('function VortexCanvas({data}:{data:VortexGeometry}){','function VortexCanvas({data,expanded}:{data:VortexGeometry;expanded:boolean}){'),
            ('  // Leave room below the context plane without changing framing between forecast times.\n  const project=(lon:number,lat:number,z:number)=>{const p=projectVortexPoint(lon,lat,z,yaw,tilt);return{x:size.w/2+p.x*scale,y:size.h*.42+p.y*scale}};', '  // Move every layer together; retain zoom and stationary controls.\n  const origin=vortexScreenOrigin(size.w,size.h,expanded);\n  const project=(lon:number,lat:number,z:number)=>{const p=projectVortexPoint(lon,lat,z,yaw,tilt);return{x:origin.x+p.x*scale,y:origin.y+p.y*scale}};'),
            ('[data,size,texture,showBase,opacity]','[data,size,texture,showBase,opacity,expanded]'),
            ('<VortexCanvas data={data}/>','<VortexCanvas data={data} expanded={expanded}/>')
          ]
          for old,new in edits:
            assert source.count(old)==1, 'Unexpected source layout: '+old[:80]
            source=source.replace(old,new)
          p.write_text(source)
          PY
      - run: npm ci --no-audit --no-fund
      - name: Type check and run the complete JavaScript regression suite
        run: |
          npm exec -- tsc --noEmit
          node --test tests/*.test.mjs
      - name: Rebuild the tracked GitHub Pages site
        run: npm run build:pages
      - name: Install isolated browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify real canvas coordinates and controls on desktop and mobile sizes
        run: |
          python -u - <<'PY'
          import hashlib,json,math,re,subprocess,time,urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          root='https://raw.githubusercontent.com/matthewhugo81-arch/stratoscope/forecast-data-vortex/'
          def get(url):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url,timeout=45) as r:return r.read()
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2**attempt)
          catalogue=get(root+'latest.json')
          manifest=json.loads(catalogue)
          bodies={}
          for hour in [0,84,96]:
              entry=manifest['files'][str(hour)]
              body=get(root+entry['path'])
              assert len(body)==entry['bytes'] and hashlib.sha256(body).hexdigest()==entry['sha256']
              assert json.loads(body).get('baseMap'), 'Anomaly base required for coordinate verification'
              bodies[entry['path']]=body
          print('Using unchanged, SHA-256 verified GEFS snapshots:',manifest['run'],flush=True)
          harness=Path('vortex-framing-smoke.html')
          harness.write_text('''<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"/></head><body><div id="root"></div><script type="module">import React from 'react';import {createRoot} from 'react-dom/client';import {VortexView} from './components/vortex-view.tsx';import './app/globals.css';createRoot(document.getElementById('root')).render(React.createElement(VortexView));</script></body></html>''')
          log=open('/tmp/vortex-vite.log','w')
          server=subprocess.Popen(['npm','run','dev:pages'],stdout=log,stderr=subprocess.STDOUT)
          try:
              for _ in range(90):
                  try:
                      urllib.request.urlopen('http://127.0.0.1:5174/stratoscope/vortex-framing-smoke.html',timeout=2).close();break
                  except Exception:time.sleep(1)
              else:raise RuntimeError('Browser test server did not start')
              init='''(() => {
                const p=CanvasRenderingContext2D.prototype;
                for(const key of ['clearRect','translate','transform','moveTo','lineTo']){
                  const original=p[key];p[key]=function(...args){
                    if(this.canvas.classList.contains('vortex-canvas')){
                      if(key==='clearRect')this.canvas.__paint={w:args[2],h:args[3],translations:[],transforms:[],minY:Infinity,maxY:-Infinity};
                      const d=this.canvas.__paint;
                      if(d&&key==='translate')d.translations.push(args);
                      if(d&&key==='transform')d.transforms.push(args);
                      if(d&&(key==='moveTo'||key==='lineTo')){d.minY=Math.min(d.minY,args[1]);d.maxY=Math.max(d.maxY,args[1]);}
                    }
                    return original.apply(this,args);
                  };
                }
              })();'''
              with sync_playwright() as pw:
                  browser=pw.chromium.launch()
                  for width,height,mobile,fallback in [(1600,955,False,False),(1366,768,False,True),(390,844,True,True),(844,390,True,True)]:
                      context=browser.new_context(viewport={'width':width,'height':height},is_mobile=mobile,has_touch=mobile,device_scale_factor=2 if mobile else 1)
                      page=context.new_page();page.set_default_timeout(60000)
                      page.add_init_script(init)
                      if fallback:page.add_init_script("Element.prototype.requestFullscreen=async()=>{throw new DOMException('Test full-window fallback','NotSupportedError')};")
                      errors=[];page.on('pageerror',lambda error:errors.append(str(error)))
                      def route(request):
                          path=urlsplit(request.request.url).path.split('/forecast-data-vortex/',1)[1]
                          if path=='latest.json':request.fulfill(status=200,content_type='application/json',body=catalogue,headers={'Access-Control-Allow-Origin':'*'})
                          elif path in bodies:request.fulfill(status=200,content_type='application/json',body=bodies[path],headers={'Access-Control-Allow-Origin':'*'})
                          else:request.continue_()
                      page.route('**/forecast-data-vortex/**',route)
                      page.goto('http://127.0.0.1:5174/stratoscope/vortex-framing-smoke.html',wait_until='domcontentloaded')
                      page.get_by_role('button',name=re.compile('Show 3D vortex structure')).click()
                      page.locator('.vortex-canvas').wait_for()
                      def measurement():
                          page.wait_for_function("document.querySelector('.vortex-canvas')?.__paint?.translations.length>0")
                          page.wait_for_timeout(120)
                          return page.locator('.vortex-canvas').evaluate('(c)=>c.__paint')
                      def check(expanded,zoom=1,yaw=.6,tilt=.55):
                          d=measurement();scale=min(d['w']*.34,d['h']*.35)*zoom
                          lift=min(75,d['h']*.1) if expanded else 0
                          x,y=d['translations'][0];a,b,c,e,_,_=d['transforms'][0]
                          assert abs(x-d['w']/2)<1e-6,(x,d)
                          assert abs(y-(d['h']*.42-lift+.79*math.cos(tilt)*scale))<1e-6,(y,d,lift)
                          assert abs(math.hypot(a,c)*512-scale)<1e-6,'Zoom changed unexpectedly'
                          assert abs(a-math.cos(yaw)*scale/512)<1e-6,'Rotation changed unexpectedly'
                          assert abs(e-math.cos(yaw)*math.sin(tilt)*scale/512)<1e-6,'Tilt changed unexpectedly'
                          return d,lift
                      check(False)
                      page.get_by_label('3D forecast time').select_option('84')
                      page.wait_for_function("document.querySelector('.vortex-stamp').textContent.includes('forecast +84h')")
                      check(False)
                      page.get_by_role('button',name='Full screen',exact=True).click()
                      page.wait_for_function("document.querySelector('#vortex-3d').classList.contains('vortex-expanded')")
                      page.wait_for_timeout(350)
                      d,lift=check(True)
                      if not fallback:assert page.evaluate("document.fullscreenElement?.id")=='vortex-3d'
                      page.get_by_role('button',name='Zoom +',exact=True).click();check(True,1.15)
                      page.get_by_role('button',name='Zoom −',exact=True).click();check(True)
                      canvas=page.locator('.vortex-canvas');canvas.focus();canvas.press('ArrowRight');check(True,yaw=.7)
                      canvas.press('ArrowUp');check(True,yaw=.7,tilt=.65)
                      canvas.press('Home');check(True)
                      overlay=page.get_by_label('500 hPa anomalies',exact=True)
                      overlay.uncheck();assert not overlay.is_checked()
                      overlay.check();check(True)
                      page.get_by_label('500 hPa anomaly opacity').fill('50');check(True)
                      page.get_by_role('button',name='Next →',exact=True).click()
                      page.wait_for_function("document.querySelector('.vortex-stamp').textContent.includes('forecast +96h')")
                      next_frame,_=check(True)
                      assert abs(next_frame['translations'][0][1]-d['translations'][0][1])<1e-6,'Origin moved between forecast times'
                      page.get_by_role('button',name='Fit & reset view',exact=True).click();check(True)
                      page.get_by_role('button',name='Exit full screen',exact=True).click()
                      page.wait_for_function("!document.querySelector('#vortex-3d').classList.contains('vortex-expanded')")
                      page.wait_for_timeout(350);check(False)
                      assert not errors,errors
                      print(json.dumps({'viewport':[width,height],'mobile':mobile,'fullscreen':'fallback' if fallback else 'native','liftCssPixels':lift,'canvas':[d['w'],d['h']],'contourMinY':d['minY'],'contourMaxY':d['maxY'],'result':'PASS: framing, zoom, rotation, tilt, reset, overlays, forecast stepping and exit'}),flush=True)
                      context.close()
                  browser.close()
          finally:
              server.terminate();server.wait(timeout=15);log.close();harness.unlink(missing_ok=True)
          PY
      - name: Commit only the tested source, tests and rebuilt Pages assets
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/vortex-view.tsx lib/vortex-projection.ts tests/vortex-framing.test.mjs docs
          git commit -m 'Lift fullscreen GEFS 3D PV scene up to 75px; preserve zoom and overlays'
          git push origin HEAD:refs/heads/fix/vortex-upward-75px-20261010
          echo "TESTED_DEPLOYMENT_COMMIT=$(git rev-parse HEAD)"
