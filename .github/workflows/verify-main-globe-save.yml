name: Verify main globe mobile repair
on:
  push:
    branches: [fix/main-globe-mobile-save-20261010]
    paths: [.github/workflows/verify-main-globe-save.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply the isolated reviewed main-globe patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/repair-main-globe-save.yml').read_text()
          body=textwrap.dedent(workflow.split("python - <<'PY'\n",1)[1].split('\n          PY',1)[0])
          # YAML has already removed the common indentation; preserve Python's
          # 12/16-space levels in the existing browser-test replacement.
          body='\n'.join(line for line in body.splitlines() if not line.startswith('new=new.splitlines()'))
          exec(compile(body,'reviewed-main-globe-patch','exec'))
          p=Path('components/globe-save-button.tsx');text=p.read_text()
          old='Boolean(navigator.share&&navigator.canShare?.({files:[file]}))'
          assert text.count(old)==1
          p.write_text(text.replace(old,"Boolean(typeof navigator.share==='function'&&navigator.canShare?.({files:[file]}))"))
          PY
      - run: npm ci --no-audit --no-fund
      - name: Compile, run regressions and rebuild Pages
        run: |
          npm exec -- tsc --noEmit
          node --test tests/*.test.mjs
          python -m py_compile tests/verify_png_exports.py tests/verify_globe_mobile_save.py
          npm run build:pages
      - name: Install isolated cross-browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.63.0 pillow
          python -m playwright install --with-deps chromium webkit > /tmp/browser-setup.log 2>&1 || { tail -n 60 /tmp/browser-setup.log; exit 1; }
      - name: Check mobile previews, file delivery and unchanged live globe pixels
        run: python -u tests/verify_globe_mobile_save.py
      - name: Verify that other image exports still work
        run: |
          python -u tests/verify_save_icon_layout.py
          python -u tests/verify_png_exports.py
      - name: Commit only verified changes and built website
        run: |
          git diff --check
          git diff --exit-code -- lib/image-export.ts lib/globe.ts components/save-image-button.tsx components/vortex-view.tsx components/heat-flux-chart.tsx components/seasonal-chart.tsx components/northern-diagnostics.tsx components/zonal-wind-card.tsx components/member-panels.tsx components/forecast-stamps.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/polar-map.tsx components/globe-save-button.tsx app/globals.css tests/verify_png_exports.py docs
          git commit -m 'Simplify main globe controls and provide safe mobile PNG preview and sharing'
          git push origin HEAD:refs/heads/fix/main-globe-mobile-save-20261010
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
