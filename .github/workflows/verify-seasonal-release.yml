name: Verify seasonal release timing repair
on:
  push:
    branches: [fix/seasonal-release-20261010]
    paths: [.github/workflows/verify-seasonal-release.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Use the shared complete-issue guard inside the importer
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('scripts/prepare-seasonal.py')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='5b87986237d230493aa3abff80abd1f51d38ee2d'
          source=p.read_text()
          old=" if old and old['nominal']==iso(nominal) and old['system']==cfg['system']:\n  print('Forecast already prepared:',model,iso(nominal));return"
          new=" if current_forecast(old,model,nominal):\n  print('Complete forecast already prepared:',model,old['nominal']);return"
          assert source.count(old)==1
          p.write_text(source.replace(old,new))
          p=Path('scripts/seasonal_config.py');source=p.read_text()
          old=' except (KeyError,TypeError,ValueError,OverflowError):return False'
          assert source.count(old)==1
          p.write_text(source.replace(old,' except (KeyError,TypeError,ValueError,OverflowError,AttributeError):return False'))
          PY
      - run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt pyyaml
      - name: Run existing and new seasonal regression tests
        run: |
          python -m py_compile scripts/seasonal_config.py scripts/plan-seasonal-update.py scripts/prepare-seasonal.py
          python -m unittest discover -s tests -p 'test_seasonal*.py' -v
          python - <<'PY'
          import yaml
          from pathlib import Path
          data=yaml.load(Path('.github/workflows/prepare-seasonal.yml').read_text(),Loader=yaml.BaseLoader)
          assert data['on']['schedule']==[{'cron':'37 */3 * * *'}]
          assert data['jobs']['prepare']['needs']=='plan'
          assert data['jobs']['prepare']['strategy']['max-parallel']=='2'
          assert data['concurrency']['cancel-in-progress']=='false'
          assert 'CDSAPI_KEY' not in str(data['jobs']['plan'])
          assert set(data['on']['workflow_dispatch']['inputs']['phase']['options'])=={'forecast','climate','era5'}
          print('PASS: 3-hour release checks, bounded preparation and secret-free lightweight planning')
          PY
      - name: Validate the guard against all seven existing public forecasts
        run: |
          python -u - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import importlib.util
          from datetime import datetime,timezone
          from seasonal_config import MODELS,current_forecast,latest,iso
          spec=importlib.util.spec_from_file_location('plan','scripts/plan-seasonal-update.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          for model in MODELS:
              data=mod.read_forecast(model)
              issue=datetime.fromisoformat(data['nominal'].replace('Z','+00:00'))
              assert current_forecast(data,model,issue), 'Published '+model+' failed complete-issue guard'
              target=latest(model,datetime.now(timezone.utc))
              print('VERIFIED',model,'published',data['nominal'],'expected',iso(target),'members',data['memberCount'],'samples',len(data['dates']),flush=True)
          PY
      - name: Commit the tested importer guard only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prepare-seasonal.py scripts/seasonal_config.py
          git commit -m 'Share validated seasonal publication guard and prevent older-issue rollback'
          git push origin HEAD:refs/heads/fix/seasonal-release-20261010
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
