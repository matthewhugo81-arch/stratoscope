name: Prepare public ensemble maps
on:
  workflow_dispatch:
    inputs:
      model:
        type: choice
        options: [all, ifs_ens, aifs_ens]
        default: all
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

jobs:
  prepare:
    # Public standard runners are free. Never run this job in a private fork.
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: prepare-ensemble-${{ matrix.model }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.model != '' && inputs.model != 'all' && format('["{0}"]', inputs.model) || '["ifs_ens","aifs_ens"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install native GRIB decoder
        run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt
      - name: Prepare all forecast times from official public feeds
        # Two decoder processes, at most six HTTP transfers across both.
        run: python -u scripts/prepare-ensembles.py --model "$MODEL" --output work/prepared --workers 3 --hour-workers 2 --skip-published
        env:
          MODEL: ${{ matrix.model }}
      - name: Publish compact data snapshot
        if: hashFiles('work/prepared/latest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ matrix.model }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh auth setup-git --hostname github.com
          python scripts/publish-ensemble-data.py --model "$MODEL" --output work/prepared
