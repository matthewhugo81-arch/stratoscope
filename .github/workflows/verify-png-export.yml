name: Verify and build image save controls
# Re-run after compile fixes; deployment remains gated on browser PNG checks.
on:
  push:
    branches: [feat/subtle-png-export-20261010]
    paths: [.github/workflows/verify-png-export.yml]
permissions:
  contents: write
concurrency:
  group: export-png-release-test
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies and add free browser-only exporter
        run: |
          npm ci --no-audit --no-fund
          npm install --save-exact html-to-image@1.11.13 --no-audit --no-fund
      - name: Compile and run existing full regression tests
        run: |
          npm exec -- tsc --noEmit
          node --test tests/*.test.mjs
      - name: Build production static website
        run: npm run build:pages
      - name: Install isolated screenshot test browser
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
      - name: Verify real PNG downloads, chart contents, 3D snapshot and mobile layouts
        run: python -u tests/check-png-browser.py
      - name: Commit only reproducible lockfile and tested static assets
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json docs
          git diff --cached --quiet || git commit -m 'Build verified PNG export viewer with pinned html-to-image dependency'
          git push origin HEAD:refs/heads/feat/subtle-png-export-20261010
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
