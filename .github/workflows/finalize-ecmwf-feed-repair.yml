name: Finalize verified ECMWF recovery
on:
  push:
    branches: [fix/ecmwf-feed-recovery-20261010]
    paths: [.github/workflows/finalize-ecmwf-feed-repair.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'matthewhugo81-arch/stratoscope'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/ensemble-requirements.txt pyyaml
      - name: Reproduce tested source edits only and exclude the currently overloaded secondary replica
        run: |
          python - <<'PY'
          import yaml,subprocess
          from pathlib import Path
          d=yaml.load(Path('.github/workflows/verify-ecmwf-feed-repair.yml').read_text(),Loader=yaml.BaseLoader)
          patch=d['jobs']['verify']['steps'][2]['run']
          boundary="update('.github/workflows/prepare-ensembles.yml',["
          assert patch.count(boundary)==1
          patch=patch[:patch.index(boundary)]+'PY\n'
          subprocess.run(['bash','-eu','-c',patch],check=True)
          p=Path('scripts/ecmwf_transport.py');text=p.read_text()
          aws="    'https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com',\n"
          assert text.count(aws)==1
          p.write_text(text.replace(aws,''))
          # AWS itself returned SlowDown in the diagnosis. A globally failing
          # optional replica must not prevent checking absent 18Z then ready 12Z.
          # Google and canonical ECMWF remain independently checked official feeds.
          for filename in ['prepare-ensembles.yml','check-pipelines.yml']:
              w=yaml.load(Path('.github/workflows/'+filename).read_text(),Loader=yaml.BaseLoader)
              assert w['permissions']['actions']=='write'
          w=yaml.load(Path('.github/workflows/check-pipelines.yml').read_text(),Loader=yaml.BaseLoader)
          assert w['on']['schedule']==[{'cron':'11 */3 * * *'}]
          PY
      - name: Verify regression and security guards
        run: |
          python -m py_compile scripts/prepare-ensembles.py scripts/check-pipelines.py scripts/ecmwf_transport.py scripts/pipeline_freshness.py
          python -m unittest discover -s tests -p test_pipeline_reliability.py -v
          python -m unittest discover -s tests -p test_ecmwf_feed_recovery.py -v
          python -m unittest discover -s tests -p test_source_security.py -v
          python scripts/check-source-security.py
      - name: Verify latest complete provider cycles using the deployed discovery policy
        run: |
          python -u - <<'PY'
          import importlib.util
          from datetime import datetime,timezone
          spec=importlib.util.spec_from_file_location('audit','scripts/check-pipelines.py')
          audit=importlib.util.module_from_spec(spec);spec.loader.exec_module(audit)
          prep=audit.preparation()
          for model in ['ifs_ens','aifs_ens']:
              run=prep.discover(model)
              assert run>=datetime(2026,10,10,12,tzinfo=timezone.utc)
              print('LATEST_FULL_INVENTORY_VERIFIED',model,run.isoformat(),flush=True)
          print('The actual 51-member +360h GRIB/PNG-bundle decoding already passed in job 114327327975; no duplicate bulk test download needed.')
          PY
      - name: Commit verified source only; workflow edits were separately applied through the authorised connector
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prepare-ensembles.py scripts/check-pipelines.py scripts/ecmwf_transport.py tests/test_pipeline_reliability.py
          git commit -m 'Publish tested official-mirror ensemble transport and truthful delayed-recovery health'
          git push origin HEAD:refs/heads/fix/ecmwf-feed-recovery-20261010
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
