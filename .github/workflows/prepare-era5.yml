name: Prepare ERA5 daily wind climatology
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: era5-daily-reference
  cancel-in-progress: false
jobs:
  year:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt
      - name: Prepare one year, reusing any completed checkpoint
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          ERA_YEAR: ${{ matrix.year }}
        run: |
          gh auth setup-git --hostname github.com
          python -u scripts/prepare-seasonal.py --phase era5 --era5-year "$ERA_YEAR"
  publish:
    needs: year
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt
      - name: Validate all 24 years and publish the daily reference
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh auth setup-git --hostname github.com
          python -u scripts/prepare-seasonal.py --phase era5 --aggregate-only
