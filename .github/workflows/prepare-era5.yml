name: Prepare ERA5 daily wind climatology
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: era5-daily-reference
  cancel-in-progress: false
jobs:
  reference:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt
      - name: Resume existing requests, complete missing years serially, and publish
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh auth setup-git --hostname github.com
          python -u scripts/prepare-seasonal.py --phase era5
