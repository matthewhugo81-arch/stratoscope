name: Diagnose seasonal imports
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [era5, legacy]
        default: era5
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/glosea-requirements.txt
      - env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = legacy ]; then
            python -u scripts/diagnose-seasonal.py
          else
            python -u scripts/diagnose-era5.py
          fi
