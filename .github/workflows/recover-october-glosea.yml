name: Recover October GloSea release
on:
  push:
    branches: [fix/seasonal-release-20261010]
    paths: [.github/workflows/recover-october-glosea.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: seasonal-forecast
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check published issues and avoid overlapping seasonal imports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u - <<'PY'
          import json, os, urllib.request
          repo='matthewhugo81-arch/stratoscope'
          def get(url, auth=False):
              headers={'User-Agent':'Stratoscope-seasonal-release-recovery'}
              if auth:headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45) as r:return json.load(r)
          for model in ['egrr','ecmf']:
              data=get(f'https://raw.githubusercontent.com/{repo}/forecast-data-seasonal/forecast/{model}.json')
              print('PUBLISHED',json.dumps({k:data.get(k) for k in ['model','nominal','preparedAt','complete','memberCount','sampling']}),flush=True)
          for workflow in ['prepare-seasonal.yml','prepare-glosea.yml']:
              runs=get(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=100',True)['workflow_runs']
              print('RECENT',workflow,json.dumps([{k:r.get(k) for k in ['id','status','conclusion','created_at']} for r in runs[:3]]),flush=True)
              for run in runs:
                  if run['status'] not in ['queued','in_progress','waiting','pending','requested']:continue
                  jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/jobs',True)['jobs']
                  active=[j for j in jobs if j['status'] in ['queued','in_progress','waiting','pending','requested']]
                  if not jobs or any(j['name']!='prepare (era5)' for j in active):
                      raise RuntimeError('Existing seasonal preparation must finish first: '+run['html_url'])
          PY
      - run: python -m pip install --disable-pip-version-check -r scripts/glosea-requirements.txt
      - name: Retrieve October GloSea and publish only all 50 validated members
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh auth setup-git --hostname github.com
          python -u scripts/prepare-seasonal.py --phase forecast --model egrr --month 2026-10
      - name: Verify the published October issue
        run: |
          python -u - <<'PY'
          import json, subprocess, urllib.request
          from pathlib import Path
          root=Path('work/seasonal-publish')
          sha=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          url=f'https://raw.githubusercontent.com/matthewhugo81-arch/stratoscope/{sha}/forecast/egrr.json'
          with urllib.request.urlopen(url,timeout=60) as response:data=json.load(response)
          assert data['nominal']=='2026-10-01T00:00:00.000Z' and data['complete'] is True
          assert data['memberCount']==50 and len(data['members'])==50 and len(data['dates'])==360
          assert all(len(m['values'])==360 for m in data['members'])
          print('VERIFIED',json.dumps({k:data[k] for k in ['model','nominal','preparedAt','memberCount','sampling']}),'dates',data['dates'][0],data['dates'][-1],flush=True)
          PY
