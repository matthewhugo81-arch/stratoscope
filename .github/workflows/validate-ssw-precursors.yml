name: Validate SSW precursor research
on:
  pull_request:
    paths:
      - 'scripts/*ssw*'
      - 'tests/test_ssw*'
      - 'research/ssw/evidence/**'
      - 'research/ssw/source-audit.json'
      - 'research/ssw/FORECAST_VERIFICATION.md'
      - '.github/workflows/validate-ssw-precursors.yml'
  workflow_dispatch:
    inputs:
      era5_end_date:
        description: 'Optional seven-day ERA5 research case end date (YYYY-MM-DD); blank runs tests only'
        required: false
        type: string
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ssw-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Preserve Pages deployment and production workflows
        run: |
          test -f docs/index.html
          python -m compileall -q scripts/ssw_sources.py scripts/ssw_diagnostics.py scripts/ssw_pv.py scripts/ssw_rwb.py scripts/prepare-ssw-precursors.py scripts/import-ssw-reanalysis.py scripts/ssw-pulsecheck.py scripts/ssw_research_archive.py scripts/ssw_wavepacket.py scripts/ssw_era5_requests.py scripts/prepare-ssw-wavepacket.py
  era5-research-case:
    if: github.event_name == 'workflow_dispatch' && inputs.era5_end_date != ''
    needs: offline-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ssw-era5-research-case
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ssw-requirements.txt cdsapi==0.7.7
      - name: Reuse matching CDS jobs or submit bounded case requests
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          CASE_END: ${{ inputs.era5_end_date }}
        run: python scripts/retrieve-ssw-era5.py --phase submit --end-date "$CASE_END" --output work/ssw-era5-case
      - name: Preserve request IDs before waiting for downloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ssw-era5-request-checkpoint
          path: work/ssw-era5-case/requests.json
          if-no-files-found: warn
          retention-days: 90
      - name: Download and independently decode the reanalysis case
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          CASE_END: ${{ inputs.era5_end_date }}
        run: python scripts/retrieve-ssw-era5.py --phase download --end-date "$CASE_END" --output work/ssw-era5-case
      - name: Retain research data and receipts without publishing to Pages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ssw-era5-research-case
          path: work/ssw-era5-case
          if-no-files-found: warn
          retention-days: 90
