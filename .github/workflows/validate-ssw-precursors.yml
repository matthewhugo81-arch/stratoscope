name: Validate SSW precursor research
on:
  pull_request:
    paths:
      - 'scripts/*ssw*'
      - 'tests/test_ssw*'
      - 'research/ssw/evidence/**'
      - 'research/ssw/source-audit.json'
      - '.github/workflows/validate-ssw-precursors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ssw-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Preserve Pages deployment and production workflows
        run: |
          test -f docs/index.html
          python -m compileall -q scripts/ssw_sources.py scripts/ssw_diagnostics.py scripts/ssw_pv.py scripts/ssw_rwb.py scripts/prepare-ssw-precursors.py scripts/import-ssw-reanalysis.py scripts/ssw-pulsecheck.py
