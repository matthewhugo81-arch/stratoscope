name: Verify accurate three-hour freshness labels
on:
  push:
    branches: [fix/three-hour-status-labels-20261010]
    paths: [.github/workflows/verify-freshness-labels.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compile, test status wording and preserve all existing chart regressions
        run: |
          npm ci --no-audit --no-fund
          npm exec -- tsc --noEmit
          node --test tests/*.test.mjs
          npm run build:pages
      - name: Commit tested built website only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'Build accurate three-hour status wording without redesigning forecasts'
          git push origin HEAD:refs/heads/fix/three-hour-status-labels-20261010
          echo "VERIFIED_UI_COMMIT=$(git rev-parse HEAD)"
      - name: Record actual production jobs and health after the repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u - <<'PY'
          import json,os,urllib.request
          from datetime import datetime,timezone
          repo='matthewhugo81-arch/stratoscope'
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'Stratoscope-final-verification'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          for workflow in ['prepare-ensembles.yml','check-pipelines.yml','test-pipelines.yml']:
              runs=get('/actions/workflows/'+workflow+'/runs?branch=main&per_page=4')['workflow_runs']
              for r in runs:
                  print('PRODUCTION',workflow,json.dumps({k:r.get(k) for k in ['id','status','conclusion','created_at','head_sha']}),flush=True)
                  if workflow=='prepare-ensembles.yml' and r['head_sha']=='eecb0545c25313c07dac228602cacb293f246cb9':
                      for j in get('/actions/runs/'+str(r['id'])+'/jobs')['jobs']:
                          print('MODEL_JOB',json.dumps({k:j.get(k) for k in ['id','name','status','conclusion','started_at','completed_at']}),flush=True)
          with urllib.request.urlopen(f'https://raw.githubusercontent.com/{repo}/forecast-status/latest.json',timeout=30) as r:report=json.load(r)
          print('ACTUAL_PUBLISHED_HEALTH',json.dumps(report),flush=True)
          print('VERIFIED_AT',datetime.now(timezone.utc).isoformat(),flush=True)
          PY
