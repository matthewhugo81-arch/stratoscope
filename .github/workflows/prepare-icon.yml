name: Prepare public DWD ICON maps
on:
  workflow_dispatch:
  schedule:
    - cron: '31 9,21 * * *'
permissions:
  contents: write
concurrency:
  group: prepare-public-icon
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'matthewhugo81-arch/stratoscope' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native decoder and spherical grid lookup
        run: python -m pip install --disable-pip-version-check -r scripts/icon-requirements.txt
      - name: Prepare all DWD pressure maps
        run: python -u scripts/prepare-icon.py --output work/prepared-icon
      - name: Publish compact data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          gh auth setup-git --hostname github.com
          python scripts/publish-ensemble-data.py --model icon --output work/prepared-icon
